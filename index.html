<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>PICK UP N GO — Smart Food Pre-Order & Pickup</title>
  <meta name="description" content="Pre-order your favourite food, choose your pickup date and time, and skip the queue. PICK UP N GO.">
  <meta name="theme-color" content="#244B38">
  <link rel="preload" as="image" href="icons/logo-256.png">
  <meta name="color-scheme" content="light">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PickUp N Go">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Boot splash (removed once the data layer is ready) -->
  <div id="boot" aria-live="polite">
    <div class="boot-logo"><img src="icons/logo-256.png" alt="PICK UP N GO" width="256" height="256"></div>
    <h1>PICK UP <em>N</em> GO</h1>
    <p>Preparing your menu…</p>
    <span class="boot-bar"><i></i></span>
  </div>

  <div id="offline-banner" role="status">You are offline — showing saved menu. Orders will need a connection in Firebase mode.</div>

  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav id="bottom-nav" aria-label="Main" hidden></nav>
  </div>
  <div id="cdrawer" class="cdrawer" aria-hidden="true"></div>

  <div id="toasts" aria-live="polite"></div>
  <div id="loader" aria-hidden="true">
    <div class="loader-card"><span class="spinner"></span><span class="loader-text">Please wait…</span></div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">PICK UP N GO needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
