<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#244B38">
  <title>Offline — PICK UP N GO</title>
  <style>
    :root { --bg: #FFF9F0; --primary: #244B38; --accent: #F4A340; --text: #292929; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: Poppins, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px; text-align: center; }
    .card { max-width: 360px; }
    .logo { display: block; width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 24px; box-shadow: 0 10px 24px rgba(0,0,0,.15); }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #6f6a61; line-height: 1.6; margin: 0 0 22px; }
    button { border: 0; background: var(--primary); color: #fff; font: 600 16px/1 inherit; padding: 16px 28px; border-radius: 999px; cursor: pointer; }
    .plate { width: 160px; height: 46px; margin: 0 auto 22px; border-radius: 50%; background: #1e1e1e; box-shadow: inset 0 -8px 0 #2b2b2b; position: relative; }
    .plate::after { content: ''; position: absolute; left: 50%; top: -28px; width: 80px; height: 48px; transform: translateX(-50%); border-radius: 50% 50% 40% 40%; background: var(--accent); opacity: .9; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icons/logo-256.png" alt="PICK UP N GO">
    <div class="plate"></div>
    <h1>You're offline</h1>
    <p>PICK UP N GO can't reach the internet right now. Check your connection and try again — your cart is saved on this device.</p>
    <button onclick="location.href='./index.html'">Try again</button>
  </div>
</body>
</html>
